<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مشاهده سه‌بعدی | پیبو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>

<div class="ar-page">
  <div class="ar-page-top">
    <a href="index.html">← بازگشت به پیبو</a>
    <span class="logo" style="color:#fff;font-size:1.1rem"><span class="mark">پ</span> PIBO</span>
  </div>

  <div class="ar-viewer-wrap">
    <model-viewer
      id="viewer"
      style="display:none"
      camera-controls
      auto-rotate
      auto-rotate-delay="1200"
      rotation-per-second="18deg"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      ar-placement="floor"
      shadow-intensity="1"
      exposure="1"
      alt="مدل سه‌بعدی پیتزا">
      <button slot="ar-button" class="btn btn-primary" style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%)">
        مشاهده در فضای واقعی (AR)
      </button>
    </model-viewer>

    <div class="ar-fallback" id="fallback">
      <span style="font-size:3rem">🍕</span>
      <h2 style="font-weight:900" id="fallback-title">در حال دریافت اطلاعات پیتزا…</h2>
      <p style="color:#cbbfae;max-width:340px;font-size:.9rem" id="fallback-text"></p>
      <a href="index.html" class="btn btn-outline" style="border-color:#fff;color:#fff">بازگشت به منو</a>
    </div>
  </div>

  <div class="ar-page-info">
    <h1 id="pizza-name">در حال بارگذاری…</h1>
    <p>برای مشاهده در فضای واقعی، روی دکمه AR بزنید — روی آیفون به‌صورت خودکار Quick Look و روی اندروید Scene Viewer باز می‌شود.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/products.js"></script>
<script>
  (async () => {
    const params = new URLSearchParams(location.search);
    const pizzaId = params.get("pizza");
    const directSrc = params.get("src");
    const directIosSrc = params.get("ios-src");
    const viewer = document.getElementById("viewer");
    const fallback = document.getElementById("fallback");
    const fallbackTitle = document.getElementById("fallback-title");
    const fallbackText = document.getElementById("fallback-text");
    const nameEl = document.getElementById("pizza-name");

    // show something immediately — a screenshot taken at any point should
    // never be a truly blank page again.
    fallback.classList.add("show");
    fallbackTitle.textContent = "در حال بررسی…";
    fallbackText.textContent = "";

    async function pibo_fileExists(url){
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);
      try{
        const res = await fetch(url, { method: "GET", cache: "no-store", signal: controller.signal });
        return res.ok;
      }catch(e){
        return false;
      }finally{
        clearTimeout(timer);
      }
    }

    try{
      // direct test mode: ?src=<url>&ios-src=<url> bypasses Firebase/product
      // lookup entirely — used to check whether ANY model loads on this
      // device/network, isolating the site setup from one specific file.
      if(directSrc){
        nameEl.textContent = "تست مستقیم مدل";
        fallbackTitle.textContent = "در حال بارگذاری کتابخانه سه‌بعدی…";
        await Promise.race([
          customElements.whenDefined("model-viewer"),
          new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 8000))
        ]).catch(() => {});

        fallbackTitle.textContent = "در حال رندر مدل سه‌بعدی…";
        viewer.setAttribute("src", directSrc);
        if(directIosSrc) viewer.setAttribute("ios-src", directIosSrc);
        viewer.style.display = "block";

        const ok = await Promise.race([
          new Promise(res => viewer.addEventListener("load", () => res(true), { once: true })),
          new Promise(res => viewer.addEventListener("error", () => res(false), { once: true })),
          new Promise(res => setTimeout(() => res(false), 10000))
        ]);

        if(ok){
          fallback.classList.remove("show");
        }else{
          fallbackTitle.textContent = "مدل تست هم رندر نشد";
          fallbackText.textContent = "یعنی مشکل از فایل پیتزای تو نیست — خود کتابخانه‌ی سه‌بعدی یا منابعش روی این شبکه/مرورگر کار نمی‌کنه.";
        }
        return;
      }

      if(!pibo_db){
        nameEl.textContent = "اتصال برقرار نیست";
        fallbackTitle.textContent = "اتصال به پایگاه‌داده برقرار نشد";
        fallbackText.textContent = "مقادیر js/firebase-config.js را طبق راهنمای README تکمیل کنید.";
        return;
      }

      fallbackTitle.textContent = "در حال بارگذاری کتابخانه سه‌بعدی…";
      const libraryReady = Promise.race([
        customElements.whenDefined("model-viewer"),
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 8000))
      ]);

      let product = null;
      try{
        [, product] = await Promise.all([
          libraryReady,
          pizzaId ? pibo_getProduct(pizzaId) : Promise.resolve(null)
        ]);
      }catch(e){
        fallbackTitle.textContent = "کتابخانه نمایش سه‌بعدی بارگذاری نشد";
        fallbackText.textContent = "اتصال اینترنت را بررسی کنید و صفحه را رفرش کنید. اگر باز هم کار نکرد، شاید دامنه‌های گوگل/CDN روی این شبکه فیلتر شده باشند.";
        nameEl.textContent = pizzaId || "";
        return;
      }

      if(!product){
        nameEl.textContent = "پیتزا یافت نشد";
        fallbackTitle.textContent = "این پیتزا پیدا نشد";
        fallbackText.textContent = "ممکن است حذف شده باشد یا لینک اشتباه باشد.";
        return;
      }

      nameEl.textContent = product.name;
      fallbackTitle.textContent = "در حال بررسی فایل مدل سه‌بعدی…";

      const base = location.href.replace(/ar\.html.*$/, "");
      const glbUrl = base + product.glb;
      const usdzUrl = product.usdz ? base + product.usdz : null;

      const glbOk = await pibo_fileExists(glbUrl);
      const usdzOk = usdzUrl ? await pibo_fileExists(usdzUrl) : false;

      if(!glbOk){
        fallbackTitle.textContent = "فایل مدل سه‌بعدی (GLB) پیدا نشد";
        fallbackText.innerHTML = `این آدرس روی سرور پیدا یا در ۸ ثانیه لود نشد:<br><code style="word-break:break-all">${glbUrl}</code><br><br>فایل را داخل پوشه <code>models</code> با همین نام دقیق (حروف بزرگ/کوچک هم مهم است) قرار دهید و دوباره Push کنید.`;
        return;
      }

      fallbackTitle.textContent = "در حال رندر مدل سه‌بعدی…";
      viewer.setAttribute("src", product.glb);
      if(usdzOk) viewer.setAttribute("ios-src", product.usdz);
      viewer.style.display = "block";

      const renderedOk = await Promise.race([
        new Promise(res => viewer.addEventListener("load", () => res(true), { once: true })),
        new Promise(res => setTimeout(() => res(false), 10000))
      ]);

      if(!renderedOk){
        fallbackTitle.textContent = "فایل پیدا شد ولی رندر نشد";
        fallbackText.innerHTML = `فایل GLB دانلود شد ولی نمایشگر سه‌بعدی نتونست ازش تصویر بسازه (نه لود شد، نه خطای مشخصی داد).<br><br>احتمال ۱: خروجی Luma AI معتبر نیست یا فرمتش با model-viewer سازگار نیست — دوباره از Luma خروجی GLB بگیر.<br>احتمال ۲: منابع کمکی نمایشگر (نور محیطی) روی این شبکه فیلتر شده — با VPN یا دیتای موبایل دوباره امتحان کن.`;
        return;
      }

      fallback.classList.remove("show");

      if(!usdzOk){
        const warn = document.createElement("div");
        warn.style.cssText = "position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#fff3;color:#fff;padding:10px 18px;border-radius:100px;font-size:.8rem;font-weight:700;text-align:center;max-width:90%;";
        warn.textContent = "فایل USDZ پیدا نشد — روی آیفون دکمه AR باز نمی‌شود، فقط مشاهده سه‌بعدی در همین صفحه کار می‌کند.";
        document.querySelector(".ar-viewer-wrap").appendChild(warn);
      }

      viewer.addEventListener("error", () => {
        viewer.style.display = "none";
        fallback.classList.add("show");
        fallbackTitle.textContent = "فایل مدل سه‌بعدی نامعتبر است";
        fallbackText.textContent = "فایل پیدا شد ولی به‌عنوان مدل سه‌بعدی معتبر (GLB) قابل خواندن نبود. خروجی Luma AI را دوباره بررسی کنید.";
      });
    }catch(err){
      // absolute last resort: show the raw error so nothing stays invisible
      fallback.classList.add("show");
      fallbackTitle.textContent = "خطای غیرمنتظره";
      fallbackText.textContent = (err && err.message) ? err.message : String(err);
    }
  })();
</script>
</body>
</html>
